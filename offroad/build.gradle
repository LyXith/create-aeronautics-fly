plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/fabric-module.gradle')

loom {
    runs {
        datagen {
            inherit client
            name = 'Offroad Fabric Data Generation'
            runDir = 'runs/datagen'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg '-Dfabric-api.datagen.modid=offroad'
        }
    }
}

dependencies {
    implementation project(path: ':simulated')
}
